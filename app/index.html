<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mistral Spreadsheet</title>
    <script>var exports = {};</script>
    <script src="../dist/spreadsheet.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(160deg, #eef2fb 0%, #f7f7fa 55%, #fdf3ec 100%);
            color: #1f2430;
            padding: 40px 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1180px;
            margin: 0 auto;
        }
        
        h1 {
            color: #1f2430;
            font-size: 28px;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: #6b7280;
            font-size: 14px;
            margin: 4px 0 22px;
        }
        
        .spreadsheet-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(31,36,48,0.12), 0 1px 3px rgba(31,36,48,0.08);
            overflow: hidden;
        }
        
        .toolbar {
            background: #f8f8f8;
            padding: 12px 16px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        
        .toolbar button {
            padding: 8px 16px;
            border: 1px solid #ccc;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .toolbar button:hover {
            background: #f0f0f0;
        }
        
        .toolbar input {
            padding: 8px 12px;
            border: 1px solid #d5d9e0;
            border-radius: 6px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 14px;
            width: 200px;
        }
        
        .spreadsheet-wrapper {
            overflow-x: auto;
            overflow-y: auto;
            max-height: 560px;
        }
        
        table {
            border-collapse: collapse;
            table-layout: fixed;
        }
        
        th, td {
            padding: 0;
            border: 1px solid #e8eaee;
            text-align: left;
            min-width: 104px;
            height: 32px;
            position: relative;
        }
        
        th {
            background: #f8f8f8;
            font-weight: 600;
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        td {
            font-size: 14px;
        }
        
        .cell {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 13px;
            padding: 4px 10px;
            outline: none;
        }
        
        .cell:focus {
            outline: 2px solid #4285f4;
            background: white;
        }
        
        .cell.formula {
            color: #1a56c8;
        }

        .cell.bold {
            font-weight: 700;
        }

        .cell.fill {
            background: #f1f4fa;
        }
        
        .cell.error {
            color: #d32f2f;
        }
        
        .cell.number {
            text-align: right;
        }
        
        .row-header {
            background: #f8f8f8;
            font-weight: 600;
            color: #666;
            text-align: center;
            min-width: 48px;
            width: 48px;
        }
        
        .col-header {
            text-align: center;
        }
        
        .stats {
            margin-top: 18px;
            padding: 12px 16px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(31,36,48,0.08), 0 1px 3px rgba(31,36,48,0.06);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 12px;
            color: #666;
        }
        
        .stats-title {
            font-weight: 600;
            margin-bottom: 4px;
            color: #333;
        }
        
        .highlight {
            background: #fff8e1;
        }

        .stats code {
            display: inline-block;
            background: #eef2fb;
            color: #1a56c8;
            border-radius: 4px;
            padding: 1px 6px;
            margin: 2px 4px 2px 0;
        }
        
        .formula-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }
        
        .formula-bar span {
            color: #666;
            font-size: 14px;
        }
        
        .formula-input {
            flex: 1;
        }
        
        .address-display {
            font-family: monospace;
            color: #1a73e8;
            font-weight: 600;
        }
        
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255,255,255,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">Loading...</div>
    <div class="container" style="display: none;" id="app">
        <h1>Mistral Spreadsheet</h1>
        <p class="subtitle">A reactive spreadsheet engine: edit a cell and only its dependents recompute.</p>
        
        <div class="spreadsheet-container">
            <div class="toolbar">
                <div class="formula-bar">
                    <span>=</span>
                    <input type="text" id="formulaInput" class="formula-input" placeholder="Enter formula...">
                </div>
                <span class="address-display" id="currentAddress">A1</span>
                <button id="clearBtn">Clear</button>
                <button id="resetStats">Reset Stats</button>
            </div>
            
            <div class="spreadsheet-wrapper">
                <table id="spreadsheet">
                    <thead>
                        <tr>
                            <th class="row-header"></th>
                            <th class="col-header">A</th>
                            <th class="col-header">B</th>
                            <th class="col-header">C</th>
                            <th class="col-header">D</th>
                            <th class="col-header">E</th>
                            <th class="col-header">F</th>
                            <th class="col-header">G</th>
                            <th class="col-header">H</th>
                            <th class="col-header">I</th>
                            <th class="col-header">J</th>
                        </tr>
                    </thead>
                    <tbody id="spreadsheetBody">
                    </tbody>
                </table>
            </div>
        </div>
        
        <div class="stats">
            <div class="stats-title">Last Recomputed Cells:</div>
            <div id="statsDisplay"></div>
        </div>
    </div>
    
    <script>
        const ROWS = 50;
        const COLS = 10;

        // Now create the app
        const sheet = new Spreadsheet();
        const bodyEl = document.getElementById('spreadsheetBody');
        const formulaInput = document.getElementById('formulaInput');
        const currentAddressEl = document.getElementById('currentAddress');
        const statsDisplay = document.getElementById('statsDisplay');
        const clearBtn = document.getElementById('clearBtn');
        const resetStatsBtn = document.getElementById('resetStats');
        const loadingEl = document.getElementById('loading');
        const appEl = document.getElementById('app');

        let currentCell = { row: 0, col: 0 };
        const cells = new Map();
        const raw = new Map();
        const boldCells = new Set();
        const fillCells = new Set();

        function colRowToAddress(col, row) {
            let colStr = '';
            let c = col + 1;
            while (c > 0) {
                c--;
                colStr = String.fromCharCode('A'.charCodeAt(0) + (c % 26)) + colStr;
                c = Math.floor(c / 26);
            }
            return colStr + row;
        }

        function createGrid() {
            bodyEl.innerHTML = '';
            for (let row = 0; row < ROWS; row++) {
                const tr = document.createElement('tr');
                const rowHeader = document.createElement('th');
                rowHeader.className = 'row-header';
                rowHeader.textContent = (row + 1).toString();
                tr.appendChild(rowHeader);
                for (let col = 0; col < COLS; col++) {
                    const td = document.createElement('td');
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.className = 'cell';
                    input.dataset.row = row.toString();
                    input.dataset.col = col.toString();
                    const address = colRowToAddress(col, row + 1);
                    input.dataset.address = address;
                    cells.set(address, input);
                    input.addEventListener('focus', () => {
                        currentCell = { row, col };
                        currentAddressEl.textContent = address;
                        const val = sheet.getCell(address);
                        formulaInput.value = raw.has(address) ? raw.get(address) : formatValue(val);
                        clearHighlights();
                        input.classList.add('highlight');
                    });
                    input.addEventListener('blur', () => {
                        const value = input.value;
                        if (value !== '') raw.set(address, value); else raw.delete(address);
                        if (value.startsWith('=')) sheet.setCell(address, value);
                        else if (value === '') sheet.setCell(address, null);
                        else if (!isNaN(Number(value))) sheet.setCell(address, Number(value));
                        else if (value.toLowerCase() === 'true') sheet.setCell(address, true);
                        else if (value.toLowerCase() === 'false') sheet.setCell(address, false);
                        else sheet.setCell(address, value);
                        refreshAll();
                        updateStats();
                    });
                    input.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') {
                            input.blur();
                            if (col < COLS - 1) cells.get(colRowToAddress(col + 1, row + 1))?.focus();
                            else if (row < ROWS - 1) cells.get(colRowToAddress(0, row + 2))?.focus();
                        } else if (e.key === 'Tab') {
                            e.preventDefault();
                            if (col < COLS - 1) cells.get(colRowToAddress(col + 1, row + 1))?.focus();
                            else cells.get(colRowToAddress(0, row + 2))?.focus();
                        } else if (e.key === 'ArrowUp' && row > 0) {
                            e.preventDefault(); cells.get(colRowToAddress(col, row))?.focus();
                        } else if (e.key === 'ArrowDown' && row < ROWS - 1) {
                            e.preventDefault(); cells.get(colRowToAddress(col, row + 2))?.focus();
                        } else if (e.key === 'ArrowLeft' && col > 0) {
                            e.preventDefault(); cells.get(colRowToAddress(col - 1, row + 1))?.focus();
                        } else if (e.key === 'ArrowRight' && col < COLS - 1) {
                            e.preventDefault(); cells.get(colRowToAddress(col + 1, row + 1))?.focus();
                        }
                    });
                    td.appendChild(input);
                    tr.appendChild(td);
                }
                bodyEl.appendChild(tr);
            }
            cells.get('A1')?.focus();
        }

        function updateCellDisplay(input, address) {
            const value = sheet.getCell(address);
            const displayValue = formatValue(value);
            input.value = displayValue;
            input.className = 'cell';
            if (raw.has(address) && raw.get(address).startsWith('=')) input.classList.add('formula');
            if (boldCells.has(address)) input.classList.add('bold');
            if (fillCells.has(address)) input.classList.add('fill');
            if (typeof value === 'number') input.classList.add('number');
            else if (value && typeof value === 'object' && 'error' in value) input.classList.add('error');
        }

        function refreshAll() {
            for (const [addr, el] of cells) updateCellDisplay(el, addr);
        }

        function formatValue(value) {
            if (value === null) return '';
            if (value === undefined) return '';
            if (typeof value === 'number') return value.toString();
            if (typeof value === 'boolean') return value.toString();
            if (value && typeof value === 'object' && 'error' in value) return value.error;
            return value.toString();
        }

        function clearHighlights() {
            for (const cell of cells.values()) cell.classList.remove('highlight');
        }

        function updateStats() {
            const stats = sheet.getStats();
            statsDisplay.innerHTML = stats.evaluatedCells.map(a => '<code>' + a + '</code>').join('') || 'None';
        }

        clearBtn.addEventListener('click', () => {
            const address = currentAddressEl.textContent;
            if (address) {
                sheet.setCell(address, null);
                const cell = cells.get(address);
                if (cell) { cell.value = ''; refreshAll(); updateStats(); }
            }
        });

        resetStatsBtn.addEventListener('click', () => {
            sheet.resetStats();
            updateStats();
        });

        function loadDemo() {
            const data = {
                A1: 'Item', B1: 'Jan', C1: 'Feb', D1: 'Mar', E1: 'Total', F1: 'Peak',
                A2: 'Rent', B2: 1200, C2: 1200, D2: 1200,
                A3: 'Groceries', B3: 420, C3: 385, D3: 450,
                A4: 'Transport', B4: 95, C4: 110, D4: 88,
                A5: 'Utilities', B5: 140, C5: 155, D5: 130,
                A6: 'Fun', B6: 220, C6: 180, D6: 310,
                A7: 'Total', B7: '=SUM(B2:B6)', C7: '=SUM(C2:C6)', D7: '=SUM(D2:D6)', E7: '=SUM(E2:E6)', F7: '=MAX(B7:D7)',
                A9: 'Budget', B9: 6500,
                A10: 'Status', B10: '=IF(E7>B9,"over budget","on track")',
                A11: 'Left', B11: '=B9-E7',
                H1: 'Edge cases', H2: 'divide by 0', I2: '=B2/0', H3: 'cycle', I3: '=J3', J3: '=I3',
                H4: 'text + 1', I4: '=A2+1',
            };
            for (let r = 2; r <= 6; r++) {
                data['E' + r] = '=SUM(B' + r + ':D' + r + ')';
                data['F' + r] = '=MAX(B' + r + ':D' + r + ')';
            }
            for (const a of ['A1','B1','C1','D1','E1','F1','H1','A7','B7','C7','D7','E7','F7']) boldCells.add(a);
            for (const a of ['A1','B1','C1','D1','E1','F1','A7','B7','C7','D7','E7','F7']) fillCells.add(a);
            for (const [addr, v] of Object.entries(data)) {
                sheet.setCell(addr, v);
                raw.set(addr, String(v));
            }
            // one live edit so the stats panel shows a recompute cascade
            sheet.resetStats();
            sheet.setCell('B3', 450);
            raw.set('B3', '450');
            refreshAll();
            const target = cells.get('E7');
            target.focus();
            currentCell = { row: 6, col: 4 };
            currentAddressEl.textContent = 'E7';
            formulaInput.value = raw.get('E7');
            clearHighlights();
            target.classList.add('highlight');
        }

        // Hide loading, show app
        loadingEl.style.display = 'none';
        appEl.style.display = 'block';
        createGrid();
        if (new URLSearchParams(location.search).has('demo')) loadDemo();
        updateStats();
    </script>
</body>
</html>
